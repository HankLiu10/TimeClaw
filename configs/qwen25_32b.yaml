# TimeClaw Configuration: Local Qwen2.5-32B via Ollama
# All agents use the same local model, no cloud fallback

llm:
  models:
    manager: "ollama/qwen2.5:32b"
    analyzer: "ollama/qwen2.5:32b"
    executor: "ollama/qwen2.5:32b"
    reasoner: "ollama/qwen2.5:32b"
    text_light: "ollama/qwen2.5:7b"
    text_heavy: "ollama/qwen2.5:32b"
  fallback: null
  max_retries: 2
  timeout: 180.0
  temperature: 0.1
  max_tokens: 4096

reasoning:
  max_evidence_steps: 10
  max_reflact_iterations: 3
  max_quality_gate_retries: 2
  critic_enabled: true

pipeline:
  enable_fingerprint: true
  enable_safeauto: true
  parallel_execution: false
  verbose: false
  multi_agent_mode: true

memory:
  enable_vector: true
  vector_dim: 256
  hybrid_vector_weight: 0.7
  hybrid_text_weight: 0.3
  max_experience_entries: 10000

context:
  max_tokens: 8000
  reserve_tokens: 2000
  compaction_threshold: 0.8
  prune_observation_chars: 200
  enable_lazy_tool_descriptions: true

scheduler:
  enabled: false
  heartbeat_interval_minutes: 30
  drift_check_enabled: true
  experience_cleanup_enabled: true

fusion:
  strategy: "confidence_weighted"
  task_weights:
    forecast:
      timeseries: 0.7
      text: 0.2
      image: 0.1
    classification:
      timeseries: 0.5
      text: 0.3
      image: 0.2
    anomaly_detection:
      timeseries: 0.6
      text: 0.2
      image: 0.2
    qa:
      timeseries: 0.2
      text: 0.6
      image: 0.2
    imputation:
      timeseries: 0.8
      text: 0.1
      image: 0.1
  llm_arbitration_enabled: true
  confidence_floor: 0.1

log_level: "INFO"
workspace_dir: ".timeclaw"
