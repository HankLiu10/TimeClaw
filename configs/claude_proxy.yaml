# TimeClaw Configuration: GPT-5.1 via Codex Portal proxy
# All agents use gpt-5.1 through ai.changyou.club

llm:
  api_base: "https://ai.changyou.club/v1"
  api_key: "sk-proj-89dy5lda8a188si2q9r5e1o4yv6xdrzo"
  models:
    manager: "openai/gpt-5.1"
    analyzer: "openai/gpt-5.1"
    executor: "openai/gpt-5.1"
    reasoner: "openai/gpt-5.1"
    text_light: "openai/gpt-5.1"
    text_heavy: "openai/gpt-5.1"
  fallback: "openai/gpt-5.1"
  max_retries: 3
  timeout: 180.0
  temperature: 0.1
  max_tokens: 4096

reasoning:
  max_evidence_steps: 10
  max_reflact_iterations: 3
  max_quality_gate_retries: 2
  critic_enabled: true

pipeline:
  enable_fingerprint: true
  enable_safeauto: true
  parallel_execution: true
  verbose: false
  multi_agent_mode: true

memory:
  enable_vector: true
  vector_dim: 256
  hybrid_vector_weight: 0.7
  hybrid_text_weight: 0.3
  max_experience_entries: 10000

context:
  max_tokens: 16000
  reserve_tokens: 4000
  compaction_threshold: 0.8
  prune_observation_chars: 200
  enable_lazy_tool_descriptions: true

fusion:
  strategy: "confidence_weighted"
  llm_arbitration_enabled: true
  confidence_floor: 0.1

log_level: "INFO"
workspace_dir: ".timeclaw"
