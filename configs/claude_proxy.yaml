llm:
  api_base: "https://ai.changyou.club/v1"
  api_key: "sk-proj-3lmogmngl1hir2symiqg77x8y66ce09z"
  models:
    manager: "openai/gpt-5.4"
    analyzer: "openai/gpt-5.4"
    executor: "openai/gpt-5.4"
    reasoner: "openai/gpt-5.4"
    text_light: "openai/gpt-5.4"
    text_heavy: "openai/gpt-5.4"
  fallback: "openai/gpt-5.4"
  max_retries: 10
  timeout: 180.0
  temperature: 1.0
  max_tokens: 4096

reasoning:
  max_evidence_steps: 10
  max_reflact_iterations: 3
  max_quality_gate_retries: 2
  critic_enabled: true

pipeline:
  enable_fingerprint: true
  enable_safeauto: true
  parallel_execution: true
  verbose: false
  multi_agent_mode: true

memory:
  enable_vector: true
  vector_dim: 256
  hybrid_vector_weight: 0.7
  hybrid_text_weight: 0.3
  max_experience_entries: 10000

context:
  max_tokens: 16000
  reserve_tokens: 4000
  compaction_threshold: 0.8
  prune_observation_chars: 200
  enable_lazy_tool_descriptions: true

fusion:
  strategy: "confidence_weighted"
  llm_arbitration_enabled: true
  confidence_floor: 0.1

log_level: "INFO"
workspace_dir: ".timeclaw"

benchmark:
  repo_root: "."
  splits_dir: "data/splits"

sbm:
  device: "cuda:2"
  devices:
    chronos2: "cuda:2"
    timesfm2: "cuda:2"
    moirai1_1_r_base: "cuda:3"
    sundial_base_128m: "cuda:3"
