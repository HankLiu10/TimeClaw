name: Core regression
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements-py310.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check timeclaw scripts tests --select E9,F821,F822,F823
      - run: python -m pip check
      - run: python scripts/setup_mtbench.py
      - run: python -m timeclaw.benchmark.run_learning --help
      - run: python scripts/run_timeclaw_mtbench_inference.py --help
      - run: python -m pytest -q --timeout=20
